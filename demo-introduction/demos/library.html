<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bibliothèque · 对角书架</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3efe7;
    --ink:#1d1a16;
    --ink-soft:#6f675c;
    --line:#d9d2c4;
    --accent:#a4553a;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    background:
      radial-gradient(1200px 800px at 85% 8%, #faf7f0 0%, transparent 60%),
      radial-gradient(900px 700px at 8% 92%, #ece5d7 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    user-select:none;
    cursor:default;
  }

  /* ---------- Header ---------- */
  header{
    position:fixed;top:34px;left:42px;z-index:50;pointer-events:none;
  }
  header .kicker{
    font-size:10px;letter-spacing:.42em;text-transform:uppercase;
    color:var(--accent);font-weight:500;margin-bottom:10px;
  }
  header h1{
    font-family:'Cormorant Garamond',serif;font-weight:600;
    font-size:clamp(28px,3.4vw,44px);line-height:1.02;letter-spacing:.01em;
  }
  header h1 em{font-style:italic;font-weight:500;color:var(--ink-soft)}
  header .hint{
    margin-top:14px;font-size:11px;letter-spacing:.14em;color:var(--ink-soft);
    display:flex;gap:18px;font-weight:300;
  }
  header .hint span{display:flex;align-items:center;gap:7px}
  header .hint i{
    width:5px;height:5px;border-radius:50%;background:var(--accent);display:inline-block;
    font-style:normal;opacity:.75;
  }

  /* ---------- Counter ---------- */
  #counter{
    position:fixed;top:44px;right:46px;z-index:50;text-align:right;pointer-events:none;
  }
  #counter .no{
    font-family:'Cormorant Garamond',serif;font-size:40px;font-weight:600;line-height:1;
  }
  #counter .of{
    font-size:10px;letter-spacing:.3em;color:var(--ink-soft);margin-top:6px;text-transform:uppercase;
  }

  /* ---------- Stage / Books ---------- */
  #stage{position:fixed;inset:0;z-index:10}
  .book{
    position:absolute;
    width:var(--bw);height:var(--bh);
    left:0;top:0;
    border-radius:3px 8px 8px 3px;
    cursor:pointer;
    transition:left .58s cubic-bezier(.22,.9,.24,1),
               top .58s cubic-bezier(.22,.9,.24,1),
               transform .42s cubic-bezier(.22,.9,.3,1.2),
               box-shadow .42s ease;
    box-shadow:0 10px 24px -12px rgba(40,30,18,.45),
               0 2px 6px -2px rgba(40,30,18,.25);
    transform:rotate(var(--tilt));
    overflow:hidden;
  }
  /* spine */
  .book::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:9px;
    background:linear-gradient(90deg,rgba(0,0,0,.32),rgba(0,0,0,.06) 55%,rgba(255,255,255,.14));
  }
  /* page edge */
  .book::after{
    content:"";position:absolute;right:0;top:2px;bottom:2px;width:3px;
    background:repeating-linear-gradient(180deg,#efe9dc 0 2px,#e2dac8 2px 3px);
    border-radius:0 2px 2px 0;opacity:.9;
  }
  .cover{
    position:absolute;inset:0;padding:16px 14px 14px 22px;
    display:flex;flex-direction:column;
    color:#f7f2e8;
  }
  .cover .frame{
    position:absolute;inset:9px 9px 9px 15px;
    border:1px solid rgba(247,242,232,.34);border-radius:2px;pointer-events:none;
  }
  .cover .cat{
    font-size:7.5px;letter-spacing:.3em;text-transform:uppercase;opacity:.72;font-weight:400;
  }
  .cover .title{
    font-family:'Cormorant Garamond',serif;font-weight:600;
    font-size:15.5px;line-height:1.22;margin-top:9px;letter-spacing:.015em;
  }
  .cover .author{
    margin-top:auto;font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;opacity:.85;font-weight:300;
  }
  .cover .num{
    font-family:'Cormorant Garamond',serif;font-style:italic;
    font-size:13px;opacity:.7;margin-top:4px;
  }
  .book:hover{
    transform:rotate(var(--tilt)) translateY(-10px);
    box-shadow:0 22px 38px -14px rgba(40,30,18,.5),
               0 4px 10px -3px rgba(40,30,18,.28);
  }
  .book.pulled{
    transform:rotate(-1.5deg) translateY(-42px) scale(1.07);
    box-shadow:0 42px 60px -18px rgba(40,30,18,.55),
               0 8px 18px -6px rgba(40,30,18,.35);
    z-index:200!important;
  }
  .book.pulled::before{background:linear-gradient(90deg,rgba(0,0,0,.42),rgba(0,0,0,.1) 55%,rgba(255,255,255,.2))}

  /* ---------- 3D Canvas ---------- */
  #gl-wrap{
    position:fixed;z-index:5;
    left:clamp(8px,3vw,50px);top:50%;transform:translateY(-46%);
    width:min(36vw,400px);height:min(36vw,400px);
    cursor:grab;
  }
  #gl-wrap:active{cursor:grabbing}
  #gl-wrap .tag{
    position:absolute;left:50%;bottom:-30px;transform:translateX(-50%);
    font-size:9px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink-soft);
    white-space:nowrap;font-weight:300;
  }
  #gl{display:block;width:100%;height:100%}

  /* ---------- Control Panel ---------- */
  #panel{
    position:fixed;right:38px;bottom:34px;z-index:60;
    width:248px;padding:20px 20px 16px;
    background:rgba(250,247,240,.78);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(29,26,22,.09);
    border-radius:14px;
    box-shadow:0 18px 40px -18px rgba(40,30,18,.3);
  }
  #panel h2{
    font-size:9.5px;letter-spacing:.34em;text-transform:uppercase;
    color:var(--ink-soft);font-weight:500;margin-bottom:14px;
    display:flex;justify-content:space-between;align-items:center;
  }
  #panel h2 b{color:var(--accent);font-weight:500}
  .ctl{margin-bottom:13px}
  .ctl label{
    display:flex;justify-content:space-between;
    font-size:10.5px;letter-spacing:.08em;color:var(--ink);
    margin-bottom:6px;font-weight:400;
  }
  .ctl label output{font-family:'Cormorant Garamond',serif;font-size:13px;font-style:italic;color:var(--accent)}
  .ctl input[type=range]{
    width:100%;height:2px;appearance:none;-webkit-appearance:none;
    background:var(--line);border-radius:2px;outline:none;cursor:pointer;
  }
  .ctl input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:var(--bg);border:2px solid var(--ink);
    transition:transform .15s ease;
  }
  .ctl input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.25)}
  .ctl input[type=range]::-moz-range-thumb{
    width:11px;height:11px;border-radius:50%;background:var(--bg);border:2px solid var(--ink);
  }
  .row{display:flex;gap:10px;align-items:center;margin-top:2px}
  .row select{
    flex:1;min-width:0;max-width:132px;font-family:'Inter',sans-serif;font-size:10.5px;letter-spacing:.06em;
    padding:6px 8px;border-radius:8px;border:1px solid var(--line);
    background:transparent;color:var(--ink);outline:none;cursor:pointer;
  }
  .switch{display:flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:.06em;cursor:pointer;white-space:nowrap;flex-shrink:0;line-height:1}
  .switch input{accent-color:var(--accent);width:13px;height:13px;cursor:pointer}
  .divider{height:1px;background:var(--line);margin:14px -20px 13px;opacity:.7}

  /* ---------- Footer caption ---------- */
  #caption{
    position:fixed;left:50%;top:40px;transform:translateX(-50%);
    z-index:50;pointer-events:none;text-align:center;max-width:320px;
  }
  #caption .bar{margin:0 auto 12px;}
  #caption .bt{
    font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:600;line-height:1.15;
    transition:opacity .3s ease;
  }
  #caption .ba{
    margin-top:6px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--ink-soft);transition:opacity .3s ease;
  }
  #caption .bar{
    width:34px;height:1px;background:var(--accent);margin-bottom:12px;
  }

  /* ---------- Reader Overlay ---------- */
  #reader{
    position:fixed;inset:0;z-index:400;display:none;
    align-items:center;justify-content:center;
  }
  #reader.open{display:flex}
  #reader-backdrop{
    position:absolute;inset:0;
    background:rgba(24,19,13,.44);
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    animation:rFade .35s ease;cursor:pointer;
  }
  @keyframes rFade{from{opacity:0}to{opacity:1}}
  .spread{
    position:relative;z-index:2;
    width:min(90vw,960px);height:min(82vh,640px);
    display:flex;perspective:2400px;
    filter:drop-shadow(0 46px 60px rgba(20,14,8,.5));
    animation:spreadIn .48s cubic-bezier(.22,.9,.3,1.15);
  }
  @keyframes spreadIn{from{opacity:0;transform:translateY(36px) scale(.93)}to{opacity:1;transform:none}}
  .page,.face{
    height:100%;overflow:hidden;position:relative;
    padding:50px 46px 62px;color:#2b251c;
    background-color:#faf7ee;
  }
  .page{width:50%}
  .page.left{
    border-radius:10px 3px 3px 10px;
    background-image:linear-gradient(270deg,rgba(90,70,40,.16) 0%,rgba(90,70,40,0) 7%);
  }
  .page.right{
    border-radius:3px 10px 10px 3px;
    background-image:linear-gradient(90deg,rgba(90,70,40,.2) 0%,rgba(90,70,40,0) 7%);
  }
  /* flipping leaf */
  .leaf{
    position:absolute;top:0;left:50%;width:50%;height:100%;
    transform-style:preserve-3d;transform-origin:left center;
    display:none;z-index:6;
  }
  .face{position:absolute;inset:0;width:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .face.back{transform:rotateY(180deg)}
  .face.right-face{
    border-radius:3px 10px 10px 3px;
    background-image:linear-gradient(90deg,rgba(90,70,40,.2) 0%,rgba(90,70,40,0) 7%);
  }
  .face.left-face{
    border-radius:10px 3px 3px 10px;
    background-image:linear-gradient(270deg,rgba(90,70,40,.16) 0%,rgba(90,70,40,0) 7%);
  }
  /* spine line */
  .spread::before{
    content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;
    background:rgba(90,70,40,.22);z-index:5;pointer-events:none;
  }
  /* page typography */
  .pg-cat{
    font-size:9px;letter-spacing:.34em;text-transform:uppercase;
    color:var(--accent);font-weight:500;margin-bottom:14px;
  }
  .pg-title{
    font-family:'Cormorant Garamond',serif;font-weight:600;
    font-size:27px;line-height:1.15;margin-bottom:20px;
  }
  .pg-body p{
    font-family:'Cormorant Garamond',serif;font-size:15.8px;
    line-height:1.78;margin-bottom:13px;text-align:justify;
  }
  .pg-body p:first-child::first-letter{
    font-size:2.05em;line-height:1;float:left;
    padding:2px 8px 0 0;color:var(--accent);font-weight:600;
  }
  .pg-num{
    position:absolute;bottom:18px;left:0;right:0;text-align:center;
    font-family:'Cormorant Garamond',serif;font-style:italic;
    font-size:13px;color:#8a7f6d;letter-spacing:.18em;
  }
  .pg-titlepage{
    height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
  }
  .pg-titlepage .tp-cat{
    font-size:9px;letter-spacing:.4em;text-transform:uppercase;
    color:var(--accent);margin-bottom:22px;
  }
  .pg-titlepage .tp-title{
    font-family:'Cormorant Garamond',serif;font-weight:600;
    font-size:34px;line-height:1.18;max-width:300px;
  }
  .pg-titlepage .tp-rule{width:38px;height:1px;background:var(--accent);margin:24px 0}
  .pg-titlepage .tp-author{
    font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:#6f675c;
  }
  .pg-titlepage .tp-ed{
    margin-top:46px;font-size:8.5px;letter-spacing:.3em;
    text-transform:uppercase;color:#a99e8a;
  }
  /* turn hints */
  .page.left::after,.page.right::after{
    position:absolute;bottom:15px;font-size:15px;color:var(--accent);
    opacity:0;transition:opacity .25s;pointer-events:none;
  }
  .page.left::after{content:"←";left:22px}
  .page.right::after{content:"→";right:22px}
  .page.left:hover::after,.page.right:hover::after{opacity:.6}
  .page.left.no-prev::after,.page.right.no-next::after{display:none}
  .page{cursor:pointer}
  #reader .hint-close{
    position:absolute;top:26px;right:36px;z-index:3;
    font-size:9.5px;letter-spacing:.32em;text-transform:uppercase;
    color:rgba(247,242,232,.85);pointer-events:none;
  }

  @media (max-width:760px){
    #gl-wrap{width:52vw;height:52vw;left:0;top:auto;bottom:120px;transform:none}
    #caption{display:none}
    #panel{right:14px;bottom:14px;width:212px;padding:16px}
    header{left:20px;top:22px}
    #counter{right:20px;top:26px}
    .spread{width:94vw;height:76vh}
    .page,.face{padding:30px 22px 52px}
    .pg-body p{font-size:14px;line-height:1.7}
    .pg-title{font-size:21px}
  }
</style>
</head>
<body>

<header>
  <div class="kicker">Diagonal Shelf · N° 07</div>
  <h1>Bibliothèque<br><em>设计之书</em></h1>
  <div class="hint">
    <span><i></i>滚轮 逐本推移</span>
    <span><i></i>点击 抽出一册</span>
    <span><i></i>拖拽 旋转雕塑</span>
  </div>
</header>

<div id="counter">
  <div class="no" id="curNo">01</div>
  <div class="of">/ 10 Volumes</div>
</div>

<div id="gl-wrap">
  <canvas id="gl"></canvas>
  <div class="tag">Objet — Drag to Rotate</div>
</div>

<div id="stage"></div>

<div id="caption">
  <div class="bar"></div>
  <div class="bt" id="capTitle">The Design of Everyday Things</div>
  <div class="ba" id="capAuthor">Don Norman</div>
</div>

<div id="panel">
  <h2>设置 <b>Paramètres</b></h2>
  <div class="ctl">
    <label>书本间距 Spacing <output id="oGap">150 px</output></label>
    <input type="range" id="rGap" min="104" max="280" value="150" step="2">
  </div>
  <div class="ctl">
    <label>对角线角度 Angle <output id="oAng">32°</output></label>
    <input type="range" id="rAng" min="18" max="58" value="32" step="1">
  </div>
  <div class="divider"></div>
  <div class="ctl">
    <label>雕塑旋转 X <output id="oRx">24°</output></label>
    <input type="range" id="rRx" min="0" max="360" value="24" step="1">
  </div>
  <div class="ctl">
    <label>雕塑旋转 Y <output id="oRy">38°</output></label>
    <input type="range" id="rRy" min="0" max="360" value="38" step="1">
  </div>
  <div class="row">
    <select id="shapeSel">
      <option value="ico" selected>二十面体 Icosahedron</option>
      <option value="knot">环结 Torus Knot</option>
      <option value="sphere">球体 Sphere</option>
      <option value="capsule">胶囊 Capsule</option>
    </select>
    <label class="switch"><input type="checkbox" id="autoRot" checked>自动旋转</label>
  </div>
</div>

<div id="reader">
  <div id="reader-backdrop"></div>
  <div class="hint-close">点击书页外 · 合上书 Click Outside to Close</div>
  <div class="spread">
    <div class="page left" id="pageL"></div>
    <div class="page right" id="pageR"></div>
    <div class="leaf" id="leaf">
      <div class="face front"></div>
      <div class="face back"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  "use strict";

  /* ================= Data ================= */
  const BOOKS = [
    {t:"The Design of Everyday Things", a:"Don Norman",            c:"Design",      h:14,  s:34, l:46},
    {t:"Grid Systems",                  a:"Josef Müller-Brockmann",c:"Typography",  h:206, s:26, l:40},
    {t:"Thinking with Type",            a:"Ellen Lupton",          c:"Typography",  h:348, s:24, l:38},
    {t:"Interaction of Color",          a:"Josef Albers",          c:"Colour",      h:46,  s:38, l:44},
    {t:"The Elements of Typographic Style", a:"Robert Bringhurst", c:"Typography",  h:262, s:22, l:36},
    {t:"As Little Design as Possible",  a:"Sophie Lovell · Rams",  c:"Industrial",  h:96,  s:20, l:40},
    {t:"Ways of Seeing",                a:"John Berger",           c:"Criticism",   h:176, s:26, l:38},
    {t:"The Vignelli Canon",            a:"Massimo Vignelli",      c:"Design",      h:0,   s:32, l:42},
    {t:"Designing Design",              a:"Kenya Hara",            c:"Aesthetics",  h:220, s:14, l:42},
    {t:"A Designer's Art",              a:"Paul Rand",             c:"Graphic",     h:288, s:26, l:40}
  ];
  const N = BOOKS.length;

  /* ================= State ================= */
  const state = {
    gap: 150,        // spacing between books along the diagonal (px)
    angle: 32,       // diagonal angle in degrees
    offset: 0,       // scroll step offset (integer, grows infinitely)
    pulled: null,    // currently pulled-out book element
    bw: 148, bh: 208 // book size
  };

  const stage = document.getElementById('stage');
  const curNo = document.getElementById('curNo');
  const capTitle = document.getElementById('capTitle');
  const capAuthor = document.getElementById('capAuthor');

  /* ================= Build books ================= */
  const bookEls = BOOKS.map((b, i) => {
    const el = document.createElement('div');
    el.className = 'book';
    el.style.setProperty('--bw', state.bw + 'px');
    el.style.setProperty('--bh', state.bh + 'px');
    el.style.setProperty('--tilt', '-5deg');
    el.style.background =
      `linear-gradient(158deg, hsl(${b.h},${b.s}%,${b.l + 9}%) 0%, hsl(${(b.h + 22) % 360},${b.s + 4}%,${b.l - 8}%) 100%)`;
    el.innerHTML =
      `<div class="cover">
         <div class="frame"></div>
         <div class="cat">${b.c}</div>
         <div class="title">${b.t}</div>
         <div class="author">${b.a}</div>
         <div class="num">Vol. ${String(i + 1).padStart(2, '0')}</div>
       </div>`;
    el.dataset.idx = i;
    el.addEventListener('click', () => togglePull(el));
    stage.appendChild(el);
    return el;
  });

  /* slot of book i in [0..N-1]; slot 0 sits top-right, grows to bottom-left */
  function slotOf(i){
    return ((i - state.offset) % N + N) % N;
  }

  function layout(){
    const W = window.innerWidth, H = window.innerHeight;
    const rad = state.angle * Math.PI / 180;
    const dx = -Math.cos(rad) * state.gap;
    const dy =  Math.sin(rad) * state.gap;
    // anchor: slot 0 near top-right
    const ax = W - state.bw - Math.max(60, W * 0.075);
    const ay = Math.max(46, H * 0.085);

    for (let i = 0; i < N; i++){
      const s = slotOf(i);
      const el = bookEls[i];
      el.style.left = (ax + dx * s) + 'px';
      el.style.top  = (ay + dy * s) + 'px';
      if (el !== state.pulled) el.style.zIndex = 100 - s; // nearer (top-right) on top
    }
    updateCaption();
  }

  function updateCaption(){
    // book currently at slot 0 = the "leading" volume
    let lead = 0;
    for (let i = 0; i < N; i++) if (slotOf(i) === 0) { lead = i; break; }
    curNo.textContent = String(lead + 1).padStart(2, '0');
    capTitle.style.opacity = 0; capAuthor.style.opacity = 0;
    setTimeout(() => {
      capTitle.textContent = BOOKS[lead].t;
      capAuthor.textContent = BOOKS[lead].a;
      capTitle.style.opacity = 1; capAuthor.style.opacity = 1;
    }, 180);
  }

  /* ================= Pull-out on click ================= */
  function togglePull(el){
    if (state.pulled === el){
      openReader(+el.dataset.idx);   // second click on a pulled book -> open it
    } else {
      if (state.pulled) state.pulled.classList.remove('pulled');
      state.pulled = el;
      el.classList.add('pulled');
    }
    layout();
  }

  /* ================= Wheel: step one book at a time, infinite ================= */
  let acc = 0, locked = false;
  function step(dir){
    state.offset += dir;
    // keep the number small to avoid float issues over long sessions
    if (state.offset >  N * 1000) state.offset -= N * 1000;
    if (state.offset < -N * 1000) state.offset += N * 1000;
    layout();
  }
  window.addEventListener('wheel', (e) => {
    if (locked || reader.open) return;
    acc += e.deltaY;
    if (Math.abs(acc) >= 42){
      step(acc > 0 ? 1 : -1);
      acc = 0;
      locked = true;
      setTimeout(() => { locked = false; }, 420);
    }
  }, { passive: true });

  /* keyboard */
  window.addEventListener('keydown', (e) => {
    if (reader.open){
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') flipNext();
      if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   flipPrev();
      if (e.key === 'Escape') closeReader();
      return;
    }

  function setShape(name){
    if (mesh) { scene.remove(mesh); mesh.geometry.dispose(); }
    if (edges){ scene.remove(edges); edges.geometry.dispose(); edges = null; }
    const g = geometries[name]();
    mesh = new THREE.Mesh(g, mat);
    if (name === 'ico'){
      edges = new THREE.LineSegments(new THREE.EdgesGeometry(g), lineMat);
      mesh.add(edges);

  function sizeGL(){

  wrap.addEventListener('pointerdown', e => {

  function syncRotUI(){
    const dx = ((rot.x * 180 / Math.PI) % 360 + 360) % 360;

    $('rRx').value = Math.round(dx); $('oRx').textContent = Math.round(dx) + '°';

  $('autoRot').addEventListener('change', e => autoRot = e.target.checked);

    { title:"Re-Design", paras:[
      "The RE-DESIGN exhibition asked architects and designers to remake the most ordinary objects: the match, the diaper, the roll of toilet paper, the macaroni. The exercise revealed how much invention sleeps inside things we have stopped seeing.",
      "Shigeru Ban's square-core toilet paper, which resists the roll and so restrains consumption, shows the method: change one constraint, and an object's whole ethic changes with it. Re-design is not restyling; it is re-thinking the agreement between object and user."]},
    { title:"Haptic", paras:[
      "Design addresses the eye, but the body is its real client. The HAPTIC exhibition explored design for the senses — objects that inform through weight, texture, temperature — proposing that intelligence is distributed across the whole skin.",
      "A paper remote control that inflates when active, a floor of gel that receives the foot: such works ask what information becomes when it is felt rather than read. The answer is a design that wakes the senses the city has dulled."]},
    { title:"White", paras:[
      "White, for Hara, is not a colour but a condition: the state in which things have not yet been decided. It is the colour of potentiality — paper before printing, rice before the meal, the MUJI shelf before the product arrives.",
      "To design with white is to design the conditions of emergence rather than the thing itself. It requires confidence in absence, a trust that the user will complete what the maker has deliberately left open."]},
    { title:"Senseware", paras:[
      "Hara proposes the word senseware for whatever excites the human senses — the technology of perception, older than any machine. Paper is senseware; so is lacquer, so is the woven mat. Design is the craft of arranging senseware so that life is felt more acutely.",
      "The idea relocates design's dignity. Its goal is not novelty of form but acuity of experience — the cool rim of a cup, the drag of a brush, the precise resistance of a well-made drawer."]},
    { title:"Emptiness", paras:[
      "Emptiness — the aesthetic engine Hara finds in Japanese culture: the empty vessel that can receive anything, the plain room that grants the guest's imagination its freedom. MUJI's no-brand plainness is this principle industrialised.",
      "Emptiness is not minimalism as style but generosity as method. The unmarked product, the silent advertisement, the white flag raised at the Expo: each declines to dictate meaning, and so each becomes capable of holding anyone's."]}],
    colophon:"Designing Design appeared in Japanese in 2003 and in English in 2007. Part essay collection, part exhibition record, it is the clearest account of the philosophy that made MUJI a byword for thoughtful plainness."},
  { foreword:[
    "Paul Rand wrote as he designed: quickly, wittily, and with a logician's intolerance for nonsense. The essays collected here defend a simple proposition — that design is a form of thinking, and that its jokes, like its grids, must be earned.",
    "Alongside the essays stand the artifacts: the trademarks, posters and book jackets through which Rand taught American business to speak modernism. Word and image together make the case that play and precision are the same virtue."],
    chapters:[
    { title:"Design and the Play Instinct", paras:[
      "Design problems are solved by play the way equations are solved by insight: suddenly, after preparation, and with a pleasure that feels like discovery. Rand defends doodling, juxtaposition and absurdity as serious instruments of the studio.",
      "Play without purpose is amusement; purpose without play is drudgery. The designer's art lies in keeping the two in suspension, so that the solution arrives wearing a smile but standing exactly where the brief required it to stand."]},
    { title:"The Trademark", paras:[
      "A trademark is a promise compressed to a mark. It must be distinctive enough to be remembered, simple enough to be reproduced anywhere, and durable enough to outlast the fashions of its birth. The best ones — Rand's among them — seem inevitable only after they exist.",
      "The IBM letters, the ABC circle, the Westinghouse W: each was a long reduction, the removal of everything inessential until the idea could no longer be simplified without disappearing. A logo is the residue of a hundred rejected drawings."]},
    { title:"The Beautiful and the Useful", paras:[
      "The old quarrel between art and utility is, for Rand, a false one. The striped pole of the barber, the shape of the Shaker box, the proportions of a well-set table: usefulness and beauty arrive together whenever a thing is made with full attention to its purpose.",
      "Design is therefore not applied art but a way of making. When function is understood deeply enough, its form pleases; when decoration is pasted on, both beauty and utility are insulted."]},
    { title:"The Politics of Design", paras:[
      "Every design decision is, in miniature, a decision about how people will live: what they will find legible, comfortable, dignified. The designer who accepts every brief accepts the world the briefs describe; the designer who chooses is practising a quiet politics.",
      "Rand's own practice made the argument concrete. By giving corporations identities of wit and clarity, he insisted that commerce need not be ugly, and that the public street deserved the same intelligence as the museum wall."]},
    { title:"Good Design Is Good Will", paras:[
      "The phrase condenses the ethic: design is a transaction of respect between maker and user. The well-made page, the honest package, the clear timetable — each says to a stranger, your time and intelligence were considered here.",
      "It is, finally, why the craft matters. Most designed things are anonymous and their makers unthanked; yet the sum of their courtesy is the texture of everyday life. Good will, drawn precisely, is the designer's signature."]}],
    colophon:"A Designer's Art was published in 1985, gathering forty years of essays and images. Rand called design the silent ambassador of a brand; the book is the ambassador's own memoir, told in equal parts type and wit."}
  ];

  const reader = { open:false, book:0, spread:0, pages:[], animating:false };
  const pageL = $('pageL'), pageR = $('pageR'), leaf = $('leaf');
  const leafFront = leaf.querySelector('.front'), leafBack = leaf.querySelector('.back');

  function buildPages(bi){
    const c = CONTENT[bi];
    const pages = [{ titlePage:true, b:BOOKS[bi] }];
    pages.push({ cat:"Foreword", title:"A Word Before", paras:c.foreword });
    c.chapters.forEach(ch => pages.push({ cat:BOOKS[bi].c, title:ch.title, paras:ch.paras }));
    pages.push({ cat:"Colophon", title:"About This Edition",
      paras:[c.colophon,
        "Set in Cormorant Garamond on warm recycled stock. Prepared for the Bibliothèque diagonal shelf — Volume " + String(bi + 1).padStart(2, '0') + " of ten."] });
    pages.forEach((p, i) => p.num = i === 0 ? "" : "·  " + (i + 1) + "  ·");
    return pages;
  }

  function pageHTML(p){
    if (p.titlePage){
      return `<div class="pg-titlepage">
        <div class="tp-cat">${p.b.c}</div>
        <div class="tp-title">${p.b.t}</div>
        <div class="tp-rule"></div>
        <div class="tp-author">${p.b.a}</div>
        <div class="tp-ed">Bibliothèque · Reader's Edition</div>
      </div>`;
    }
    return `<div class="pg-cat">${p.cat}</div>
      <h3 class="pg-title">${p.title}</h3>
      <div class="pg-body">${p.paras.map(t => `<p>${t}</p>`).join('')}</div>
      <div class="pg-num">${p.num}</div>`;
  }

  function renderSpread(){
    const s = reader.spread, pg = reader.pages;
    pageL.innerHTML = pageHTML(pg[2 * s]);
    pageR.innerHTML = pageHTML(pg[2 * s + 1]);
    pageL.classList.toggle('no-prev', s === 0);
    pageR.classList.toggle('no-next', s >= pg.length / 2 - 1);
  }

  function openReader(bi){
    reader.open = true; reader.book = bi; reader.spread = 0; reader.animating = false;
    reader.pages = buildPages(bi);
    leaf.style.display = 'none';
    renderSpread();
    $('reader').classList.add('open');
  }
  function closeReader(){
    if (!reader.open) return;
    reader.open = false;
    $('reader').classList.remove('open');
    if (state.pulled){ state.pulled.classList.remove('pulled'); state.pulled = null; }
    layout();
  }

  function onLeafDone(commit){
    leaf.addEventListener('transitionend', function h(){
      leaf.removeEventListener('transitionend', h);
      leaf.style.display = 'none';
      commit();
      reader.animating = false;
    });
  }

  /* click right page -> flip forward */
  function flipNext(){
    if (!reader.open || reader.animating) return;
    const s = reader.spread, pg = reader.pages;
    if (s >= pg.length / 2 - 1) return;
    reader.animating = true;
    leaf.style.left = '50%'; leaf.style.transformOrigin = 'left center';
    leafFront.className = 'face front right-face';
    leafBack.className  = 'face back left-face';
    leafFront.innerHTML = pageHTML(pg[2 * s + 1]);  // current right page
    leafBack.innerHTML  = pageHTML(pg[2 * s + 2]);  // next left page
    pageR.innerHTML     = pageHTML(pg[2 * s + 3]);  // next right page, revealed underneath
    leaf.style.transition = 'none';
    leaf.style.transform  = 'rotateY(0deg)';
    leaf.style.display    = 'block';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      leaf.style.transition = 'transform .72s cubic-bezier(.4,.05,.25,1)';
      leaf.style.transform  = 'rotateY(-180deg)';
    }));
    onLeafDone(() => { reader.spread = s + 1; renderSpread(); });
  }

  /* click left page -> flip backward (disabled on the first spread) */
  function flipPrev(){
    if (!reader.open || reader.animating) return;
    const s = reader.spread, pg = reader.pages;
    if (s <= 0) return;
    reader.animating = true;
    leaf.style.left = '0'; leaf.style.transformOrigin = 'right center';
    leafFront.className = 'face front left-face';
    leafBack.className  = 'face back right-face';
    leafFront.innerHTML = pageHTML(pg[2 * s]);      // current left page
    leafBack.innerHTML  = pageHTML(pg[2 * s - 1]);  // previous right page
    pageL.innerHTML     = pageHTML(pg[2 * s - 2]);  // previous left page, revealed underneath
    leaf.style.transition = 'none';
    leaf.style.transform  = 'rotateY(0deg)';
    leaf.style.display    = 'block';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      leaf.style.transition = 'transform .72s cubic-bezier(.4,.05,.25,1)';
      leaf.style.transform  = 'rotateY(180deg)';
    }));
    onLeafDone(() => { reader.spread = s - 1; renderSpread(); });
  }

  pageL.addEventListener('click', e => { e.stopPropagation(); flipPrev(); });
  pageR.addEventListener('click', e => { e.stopPropagation(); flipNext(); });
  leaf.addEventListener('click', e => e.stopPropagation());
  $('reader-backdrop').addEventListener('click', closeReader);

  /* ================= Init ================= */
  layout();
})();
</script>

<script>
/* 嵌入幻灯片：将 PgUp/PgDn/空格/Home/End 转发给父页用于翻页；
   方向键留给 demo 自身交互，不转发 */
(function(){
  if (window.parent === window) return;
  var KEYS = {PageUp:1, PageDown:1, ' ':1, Home:1, End:1};
  window.addEventListener('keydown', function(e){
    if (!KEYS[e.key]) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    try {
      window.parent.dispatchEvent(new window.parent.KeyboardEvent('keydown', {key: e.key}));
      e.preventDefault();
    } catch(err){}
  }, true);
})();
</script>
</body>

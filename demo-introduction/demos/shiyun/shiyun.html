<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>诗云 · POETRY GALAXY | 五十恒星 · 五百星辰</title>
<meta name="description" content="灵感源自刘慈欣《诗云》——五十位诗人化作恒星，五百首诗歌化作星辰，在三维星河中漫游。" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-[#020108] text-slate-200 overflow-hidden select-none antialiased">

<!-- 3D 画布 -->
<canvas id="scene" class="fixed inset-0 w-full h-full block"></canvas>

<!-- 加载遮罩 -->
<div id="loading" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#020108] transition-opacity duration-1000">
  <div class="loading-star"></div>
  <p class="mt-8 serif text-lg tracking-[0.5em] text-cyan-200/80">诗 云</p>
  <p class="mt-3 text-xs tracking-[0.3em] text-slate-500">正在汇聚五百首星辰 ……</p>
</div>

<!-- 顶栏 -->
<header class="fixed top-0 left-0 right-0 z-30 flex items-start justify-between gap-4 px-5 py-4 md:px-8 md:py-6 pointer-events-none">
  <div class="pointer-events-auto">
    <h1 class="serif text-3xl md:text-4xl font-black leading-none title-glow">诗云</h1>
    <p class="mt-1.5 text-[10px] md:text-xs tracking-[0.35em] text-cyan-300/70">POETRY&nbsp;GALAXY</p>
    <p id="stats" class="mt-2 text-[10px] md:text-xs text-slate-500 tracking-wider"></p>
  </div>

  <div class="pointer-events-auto flex flex-col items-end gap-2">
    <!-- 搜索 -->
    <div class="relative w-56 md:w-72">
      <input id="searchInput" type="text" placeholder="搜索诗人 / 诗名，如：李白、将进酒"
        class="w-full rounded-full bg-white/5 border border-white/10 backdrop-blur-md px-4 py-2 text-xs md:text-sm
               placeholder:text-slate-500 focus:outline-none focus:border-cyan-400/60 focus:bg-white/10 transition" />
      <div id="searchResults" class="absolute right-0 mt-2 w-full max-h-72 overflow-y-auto rounded-xl bg-[#0a0a1a]/90
           border border-white/10 backdrop-blur-xl shadow-2xl shadow-black/60 hidden"></div>
    </div>
    <!-- 按钮组 -->
    <div class="flex gap-2">
      <button id="btnRandom" class="ui-btn">✦ 随机漫游</button>
      <button id="btnReset" class="ui-btn">⌂ 重置视角</button>
    </div>
  </div>
</header>

<!-- 朝代图例 -->
<div id="legend" class="fixed left-5 bottom-5 md:left-8 md:bottom-8 z-30 flex flex-wrap gap-x-3 gap-y-1.5 max-w-[60vw]"></div>

<!-- 操作提示 -->
<div class="fixed right-5 bottom-5 md:right-8 md:bottom-8 z-30 text-right text-[10px] md:text-xs text-slate-500 leading-5 tracking-wider">
  <p>左键拖拽 · 旋转</p>
  <p>右键拖拽 · 平移　滚轮 · 缩放</p>
  <p>点击星辰 · 阅读诗文</p>
</div>

<!-- 开场引言 -->
<div id="quote" class="fixed left-1/2 bottom-[18%] -translate-x-1/2 z-20 text-center pointer-events-none transition-opacity duration-[2000ms]">
  <p class="serif text-sm md:text-lg text-slate-300/90 tracking-[0.2em] leading-relaxed">「所有的诗都已写就，<br class="md:hidden" />只待一颗星辰被点亮。」</p>
  <p class="mt-2 text-[10px] md:text-xs text-slate-500 tracking-[0.3em]">—— 致敬 刘慈欣《诗云》</p>
</div>

<!-- 悬浮提示 -->
<div id="tooltip" class="fixed z-40 pointer-events-none hidden px-3 py-1.5 rounded-lg bg-black/70 border border-cyan-300/30
     backdrop-blur-md text-xs tracking-wider whitespace-nowrap"></div>

<!-- 详情面板（Bento Grid） -->
<aside id="panel" class="fixed top-0 right-0 z-40 h-full w-[92vw] max-w-[430px] translate-x-full transition-transform duration-500 ease-out">
  <div class="h-full m-3 md:m-4 rounded-2xl bg-[#070716]/85 border border-white/10 backdrop-blur-2xl shadow-2xl shadow-black/70 flex flex-col overflow-hidden">
    <div class="flex items-center justify-between px-4 py-3 border-b border-white/10">
      <span id="panelCrumb" class="text-[10px] tracking-[0.3em] text-cyan-300/70">STAR&nbsp;DETAIL</span>
      <button id="panelClose" class="w-7 h-7 rounded-full bg-white/5 hover:bg-white/15 border border-white/10 text-slate-400 hover:text-white transition text-sm">✕</button>
    </div>
    <div id="panelContent" class="flex-1 overflow-y-auto p-3 md:p-4"></div>
  </div>
</aside>

<script src="js/data.js"></script>
<script type="module" src="js/main.js"></script>

<script>
/* 嵌入幻灯片：将 PgUp/PgDn/空格/Home/End 转发给父页用于翻页；
   方向键留给 demo 自身交互，不转发 */
(function(){
  if (window.parent === window) return;
  var KEYS = {PageUp:1, PageDown:1, ' ':1, Home:1, End:1};
  window.addEventListener('keydown', function(e){
    if (!KEYS[e.key]) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    try {
      window.parent.dispatchEvent(new window.parent.KeyboardEvent('keydown', {key: e.key}));
      e.preventDefault();
    } catch(err){}
  }, true);
})();
</script>
</body>
</html>
